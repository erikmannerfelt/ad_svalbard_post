[project]
name = "ad-svalbard-post"
version = "0.1.0"
description = "Per-glacier statistics and figures of Svalbard glacier elevation change 2013-2024 from ArcticDEM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erik Mannerfelt" }]
requires-python = ">=3.12"
# Lower bounds are the versions the published results were produced with.
dependencies = [
    "geopandas>=1.1",
    "matplotlib>=3.11",
    "netcdf4>=1.7",
    "numpy>=2.5",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pillow>=12.3",
    "pyarrow>=24",
    "pyogrio>=0.13",
    "rasterio>=1.5",
    "scipy>=1.18",
    "shapely>=2.1",
    "tqdm>=4.68",
    "xarray>=2026.7",
]

[dependency-groups]
dev = ["pyrefly", "pytest", "ruff"]

# The code runs from the repository root (`python main.py`) and is not installed as a
# package; `pip install .` only installs the dependencies.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "--doctest-modules"
